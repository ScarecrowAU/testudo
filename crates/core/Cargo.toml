[package]
name = "testudo-core"
description = "Testudo orchestrator: spawns runners, ingests adapter streams, fans out to consumers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
testudo-protocol.workspace = true
anyhow.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
json5.workspace = true
globset.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Generates schemas/testudo-config.schema.json (project_config tests).
schemars = "1.2"
# Checks the README's example config against that schema.
jsonschema = { version = "0.61", default-features = false }
