[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/store", "crates/ui", "crates/cli", "crates/update", "crates/dev"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
testudo-protocol = { path = "crates/protocol" }
testudo-core = { path = "crates/core" }
testudo-store = { path = "crates/store" }
testudo-update = { path = "crates/update" }
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Project config (.testudo/config.json): JSON5 syntax, `path` globs.
json5 = "0.4"
globset = "0.4"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gpui-kit = "=0.9.1"
smallvec = "1"
futures = "0.3"
rusqlite = { version = "0.42", features = ["bundled"] }
libc = "0.2"
# macOS Dock icon (crates/ui); already in the tree through gpui.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
# Optional OTLP export of Testudo's own traces and logs (TESTUDO_OTLP_ENDPOINT).
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = "0.33.1"
tracing-opentelemetry = "0.34.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Self-update (crates/update).
flate2 = "1"
minisign-verify = "0.3"
semver = "1"
tar = { version = "0.4", default-features = false }
ureq = { version = "3.5", features = ["json"] }
minisign = "0.10"

# Dependencies (gpui, image decoding, sqlite) optimised even in dev builds:
# unoptimised, a recorded frame takes ~100 ms to decode and playback in
# `make dev` drops to ~10 fps. Built once and cached; our own crates still
# compile at dev speed.
[profile.dev.package."*"]
opt-level = 2

# Release builds (`make build`/`make install`, release archives and
# bleeding-edge updates): thin LTO, one codegen unit and stripped symbols make
# `testudo` about 37% smaller (47 MB) and a clean build about 45 s slower.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
