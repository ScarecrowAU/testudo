[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/store", "crates/app", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
testudo-protocol = { path = "crates/protocol" }
testudo-core = { path = "crates/core" }
testudo-store = { path = "crates/store" }
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = "0.37"
egui = "0.37"
egui_tiles = "0.18"
rusqlite = { version = "0.42", features = ["bundled"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
