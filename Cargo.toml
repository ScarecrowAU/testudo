[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/store", "crates/ui", "crates/cli", "crates/dev"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
testudo-protocol = { path = "crates/protocol" }
testudo-core = { path = "crates/core" }
testudo-store = { path = "crates/store" }
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gpui-kit = "=0.9.1"
smallvec = "1"
futures = "0.3"
rusqlite = { version = "0.42", features = ["bundled"] }
libc = "0.2"
# Optional OTLP export of Testudo's own traces and logs (TESTUDO_OTLP_ENDPOINT).
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = "0.33.1"
tracing-opentelemetry = "0.34.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
