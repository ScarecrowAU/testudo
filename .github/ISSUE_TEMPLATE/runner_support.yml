name: Test runner support
description: Ask for a test runner Testudo doesn't support yet.
title: "Support "
labels: [runner support]
body:
  - type: markdown
    attributes:
      value: Check the compatibility table in the README first. Requests for runners already listed as planned are still useful: your setup details help decide what to support first.
  - type: input
    id: runner
    attributes:
      label: Runner
      placeholder: "Jest 30"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Does it drive a browser?
      options:
        - "Yes, through Playwright"
        - "Yes, through something else (say below)"
        - "No"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: How do you run it?
      description: Config files, commands and anything unusual about your setup (monorepo, custom reporters).
    validations:
      required: true
