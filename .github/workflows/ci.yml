name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*"]
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; main runs finish so the cache is saved.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Filtered per job, not with `on.paths`, so a docs-only PR still reports
  # the required `CI` check instead of leaving it pending.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - "crates/**"
              - "adapters/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Makefile"
              - ".github/workflows/ci.yml"

  # Cheap, needs no build: runs on every change.
  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # gpui's Linux backends (Wayland, X11, fonts) link against these.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The updater compares the tag with the version built into the binary.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }

      # Optimised (tests decode recorded frames), but without the release
      # profile's LTO and single codegen unit, which only the shipped binaries
      # need and which make every test binary slow to link.
      - name: Test
        run: >-
          cargo test --workspace --locked --release
          --config 'profile.release.lto=false'
          --config 'profile.release.codegen-units=16'

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: make build

      # Portable layout: the binaries find adapters/ next to themselves.
      # Named by target triple, which is how the updater finds its archive.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name=testudo-${GITHUB_REF_NAME}-$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p "dist/$name/adapters"
          cp target/release/testudo target/release/testudo-cli README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp adapters/js/*.mjs adapters/js/package.json "dist/$name/adapters/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: testudo-${{ runner.os }}
          path: dist/*.tar.gz

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    # Holds MINISIGN_SECRET_KEY; only v* tags can deploy to it.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # The updater only installs archives signed with this key.
      - name: Sign archives
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          key=$(mktemp)
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for f in dist/*.tar.gz; do minisign -S -s "$key" -m "$f" < /dev/null; done
          rm -f "$key"

      # Verify with: gh attestation verify <archive> --repo ScarecrowAU/testudo
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.minisig --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # The one check branch rules require: passes when formatting is clean and
  # the tests passed or were skipped as irrelevant, fails otherwise. (A skipped
  # matrix job reports no per-platform checks, so those can't be required.)
  ci:
    name: CI
    if: always()
    needs: [changes, fmt, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        run: |
          echo "changes=${{ needs.changes.result }} fmt=${{ needs.fmt.result }} test=${{ needs.test.result }}"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          [ "${{ needs.fmt.result }}" = success ] || exit 1
          case "${{ needs.test.result }}" in success|skipped) ;; *) exit 1 ;; esac
