name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*"]
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled; main runs finish so the cache is saved.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Filtered per job, not with `on.paths`, so a docs-only PR still reports
  # the required `CI` check instead of leaving it pending.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "crates/**"
              - "adapters/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "Makefile"
              - ".github/workflows/ci.yml"

  # Cheap, needs no build: runs on every change.
  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # gpui's Linux backends (Wayland, X11, fonts) link against these.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2

      # Release profile so a tag's binary build below reuses this compile.
      - name: Test
        run: cargo test --workspace --locked --release

      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: make build

      # Portable layout: the binaries find adapters/ next to themselves.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name=testudo-${GITHUB_REF_NAME}-$(uname -s | tr A-Z a-z)-$(uname -m)
          mkdir -p "dist/$name/adapters"
          cp target/release/testudo target/release/testudo-cli README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp adapters/js/*.mjs adapters/js/package.json "dist/$name/adapters/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: testudo-${{ runner.os }}
          path: dist/*.tar.gz

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # The one check branch rules require: passes when formatting is clean and
  # the tests passed or were skipped as irrelevant, fails otherwise. (A skipped
  # matrix job reports no per-platform checks, so those can't be required.)
  ci:
    name: CI
    if: always()
    needs: [changes, fmt, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        run: |
          echo "changes=${{ needs.changes.result }} fmt=${{ needs.fmt.result }} test=${{ needs.test.result }}"
          [ "${{ needs.changes.result }}" = success ] || exit 1
          [ "${{ needs.fmt.result }}" = success ] || exit 1
          case "${{ needs.test.result }}" in success|skipped) ;; *) exit 1 ;; esac
